<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Telematic Network Diagnostics</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
    <script src="__config.js"></script>
    <script src="shared.js"></script>
    <script>
      // Single page, two roles: the performer port serves the performer
      // view, the monitor port serves the operator console. Socket.IO
      // is served by the performer server; the monitor page loads it
      // cross-port. No CDN: performances run offline.
      document.write(
        '\x3Cscript src="http://' +
          location.hostname +
          ':' +
          window.PNDS.performerPort +
          '/socket.io/socket.io.js"\x3E\x3C/script\x3E',
      );
    </script>
  </head>

  <body>
    <main id="app"></main>

    <script>
      window.PNDS_IS_MONITOR =
        window.location.port === String(window.PNDS.monitorPort);

      if (window.PNDS_IS_MONITOR) {
        // Theme following (spec §5.3): the monitor page follows the
        // App's pushed theme. The derive hook maps the App palette to
        // this page's status colors (WCAG-tuned per surface by the
        // module itself) — the options global must exist before the
        // module loads.
        window.PNDS_THEME_OPTIONS = {
          derive: function (palette) {
            return window.PNDS_THEME.statusVariables(palette);
          },
        };
        document.write(
          '\x3Cscript src="/__pnds/theme-follow.js"\x3E\x3C/script\x3E',
        );
        document.write('\x3Cscript src="monitor.js"\x3E\x3C/script\x3E');
      } else {
        document.write('\x3Cscript src="performer.js"\x3E\x3C/script\x3E');
      }
    </script>
  </body>
</html>
