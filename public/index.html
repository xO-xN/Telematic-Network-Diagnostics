<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Telematic Network Diagnostics</title>
    <link rel="stylesheet" href="style.css" />
    <script src="./__pnds/context.js"></script>
    <script src="__config.js"></script>
    <script src="shared.js"></script>
    <script src="geography.js"></script>
    <script src="land.js"></script>
    <script src="./__pnds/shared/socket.io.js"></script>
    <script>
      // Both required runtime ports expose the diagnostic console. No
      // performer registration or local-network probe runs on either page.
      window.PNDS_THEME_OPTIONS = {
        derive: function (palette) {
          return window.PNDS_THEME.statusVariables(palette);
        },
        onTheme: function (name) {
          var root = document.documentElement;
          name = name === "lavender" ? "pond" : name;
          root.setAttribute("data-utility-theme", name || "pond");
          root.style.colorScheme = name === "stage" ? "dark" : "light";
          // Categorical node colors use the App's syntax roles, separate
          // from link quality. Identity slots remain stable across themes.
          var colors = {
            pond: ["#155fc4", "#7e22ce", "#a34200", "#16703a", "#ac2758"],
            sand: ["#1b50a6", "#7c249c", "#8d3700", "#185e29", "#9d2350"],
            stage: ["#7dd3e8", "#ccafd9", "#e1bd80", "#a5c8b6", "#f0a3b3"],
            brutal: ["#004fcc", "#7800bf", "#aa3b00", "#086b2e", "#b0184f"],
          };
          (colors[name] || colors.pond).forEach(function (color, index) {
            root.style.setProperty("--node-" + index, color);
          });
        },
      };
    </script>
    <script src="./__pnds/theme-follow.js"></script>
    <script src="./__pnds/locale-follow.js"></script>
    <script defer src="monitor.js"></script>
  </head>
  <body><main id="app"></main></body>
</html>
